name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Build
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --locked

  lint:
    name: Lint (Bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint gweather-add-loc.sh
        run: shellcheck gweather-add-loc.sh

  build-script:
    name: Build Script Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test script syntax
        run: bash -n gweather-add-loc.sh

      - name: Test script help
        run: ./gweather-add-loc.sh --help