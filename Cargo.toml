[package]
name = "gweather-add-loc"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "GTK4/libadwaita app to add custom locations to GNOME Weather"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_6"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_4"] }

[profile.release]
lto = true
strip = true
opt-level = "s"
